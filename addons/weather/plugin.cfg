[plugin]

name="Weather System (Lite)"
description="Free 2D + 3D weather for Godot 4.5+. Six states (clear/cloudy/rain/storm/snow/fog) with wind, a per-state look profile, drop-in 2D and 3D drivers, a weather readout, and a no-code setup dock. Pick the weather and it looks right. The full version adds weather that runs itself: weighted transitions, a readable forecast, save support, event mirroring, and hooks that make a storm change what the player can do."
author="Sean Elovirta"
version="1.2.4"
script="plugin.gd"
